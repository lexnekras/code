name: Build Hotkeys for Windows

on:
  push:
    branches: [codex/hotkeys-template-editor]
    paths:
      - hotkeys_with_template_editor.py
      - hotkeys_with_template_editor.pyw
      - test_hotkeys_editor.py
      - build-requirements-windows.txt
      - .github/build/**
      - .github/workflows/build-hotkeys-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotkeys-windows-build
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create isolated build environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Publish running status
        env:
          BUILD_PHASE: running
        run: python .github/build/publish_windows_build.py
      - name: Install verified Windows build dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build-requirements-windows.txt *> dependency-install.log
          if ($LASTEXITCODE -ne 0) { Get-Content dependency-install.log; exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test, build and run the native executable
        run: python .github/build/windows_build.py
      - name: Publish executable or failure diagnostics
        if: always()
        env:
          BUILD_PHASE: complete
          BUILD_JOB_STATUS: ${{ job.status }}
        run: python .github/build/publish_windows_build.py
      - name: Retain Windows build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hotkeys-Windows-x64
          path: windows-output/
          if-no-files-found: warn
          retention-days: 14
